# Generator e2e tests - relational variant.
#
# This compose file exists separately from docker-compose.relational.test.yaml because
# the generator CRUD tests (test/generators/run-crud-relational.sh) need to generate
# and run Drizzle migrations for the freshly-generated entities before the API boots.
# That extra step lives in test/generators/startup.relational.test.sh, mounted into
# the api service below.
services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    expose:
      - 5432
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - 1025
      - 8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: relational.test.Dockerfile
    init: true
    env_file:
      - env-example-relational
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    volumes:
      - ./src:/usr/src/app/src
      - ./test:/usr/src/app/test
      - ./test/generators/startup.relational.test.sh:/opt/startup.relational.test.sh
