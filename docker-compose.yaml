name: backend

services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - amanah-postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=${DB_TIMEZONE:-Asia/Jakarta}", "-c", "log_timezone=${DB_TIMEZONE:-Asia/Jakarta}"]
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME wajib diisi di .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME wajib diisi di .env}
      TZ: ${PROCESS_TZ:-Asia/Jakarta}
      PGTZ: ${DB_TIMEZONE:-Asia/Jakarta}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  adminer:
    image: adminer
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8080}:8080"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER wajib diisi di .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD wajib diisi di .env}
    volumes:
      - amanah-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: on-failure:3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: true
    environment:
      APP_RUNTIME: container
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/1
      SMTP_HOST: mailpit
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER wajib diisi di .env}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD wajib diisi di .env}@rabbitmq:5672
    develop:
      watch:
        - action: sync+restart
          path: ./dist
          target: /usr/src/app/dist
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:${APP_PORT:-3001}"
    volumes:
      - ./data/uploads:/usr/src/app/data/uploads
      - ./config:/usr/src/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${APP_PORT:-3001}/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  amanah-postgres-data:
  amanah-rabbitmq-data:

