services:
  postgres:
    image: postgres:17.9-alpine
    ports:
      - ${POSTGRES_HOST_PORT:-5433}:5432
    volumes:
      - amanah-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-amanah}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-amanah_secret}
      POSTGRES_DB: ${DATABASE_NAME:-amanah_healthcare}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME:-amanah} -d ${DATABASE_NAME:-amanah_healthcare}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - ${REDIS_HOST_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - env-example-relational
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - ${APP_PORT:-3001}:${APP_PORT:-3001}

volumes:
  amanah-postgres-data:
