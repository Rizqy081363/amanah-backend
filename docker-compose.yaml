services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - amanah-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-amanah}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-amanah_secret}
      POSTGRES_DB: ${DATABASE_NAME:-amanah_healthcare}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  adminer:
    image: adminer
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8080}:8080"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 15s
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: on-failure:3
    stop_grace_period: 30s
    env_file:
      - env-example-relational
    environment:
      APP_PORT: ${APP_PORT:-3001}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-http://localhost:3000}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-http://localhost:3001}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      WAIT_TIMEOUT_SECONDS: ${WAIT_TIMEOUT_SECONDS:-60}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-amanah}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-amanah_secret}
      DATABASE_NAME: ${DATABASE_NAME:-amanah_healthcare}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:${APP_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${APP_PORT:-3001}/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  amanah-postgres-data:
